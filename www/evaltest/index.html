<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv Eval Test</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div class="background">
        <div class="glass-card">
            <header>
                <h1>🌐 Webserv Eval Test</h1>
                <p>Testing environment under /www/evaltest</p>
            </header>
            <main>
                <section>
                    <h2>📤 Upload a File</h2>
                    <form action="/uploads/upload.txt" method="POST" enctype="multipart/form-data">
                        <input type="file" name="file" required>
                        <button type="submit">Upload</button>
                    </form>
                    <a href="/uploads/">📂 View Uploaded Files</a>
                </section>

                <section>
                    <h2>💬 Message Board</h2>
                    <form action="/cgi-bin/messages.py" method="POST">
                        <input type="text" name="user" placeholder="Your name" required>
                        <input type="text" name="message" placeholder="Message..." required>
                        <button type="submit">Post</button>
                    </form>
                    <a href="/cgi-bin/messages.py">📜 View Messages</a>
                </section>

                <section>
                    <h2>🧠 CGI Tests</h2>
                    <a href="/cgi-bin/hello.py">Run hello.py</a>
                    <form action="/cgi-bin/echo.py" method="POST">
                        <input type="text" name="name" placeholder="Type something..." required>
                        <button type="submit">POST to echo.py</button>
                    </form>
                </section>

                <section>
                    <h2>🖼 Image Gallery</h2>
                    <a href="/images/">Open gallery</a>
                </section>
            </main>
            <footer>
                <p>&copy; 2025 Webserv Eval Environment</p>
            </footer>
        </div>
    </div>
</body>
</html>
