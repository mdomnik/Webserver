# ==========================================
# COMPLEX MULTI-SERVER CONFIGURATION
# ==========================================

# ================= SERVER 1 =================
server {
    listen 127.0.0.1:8080;
    listen localhost:80;
    server_name alpha_server;
    client_max_bady_size 2000;

    error_page 400 /errors/400.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # --- Locations ---
    location / {
        methods GET POST;
        root /var/www/alpha/html;
        autoindex on;
        index index.html;
    }

    location /upload {
        methods POST;
        root /var/www/alpha/uploads;
        upload_enable on;
        upload_store /var/www/alpha/uploads;
    }

    location /redirect {
        methods GET;
        root /var/www/alpha/html;
        return 301 http://new.alpha.com/;
    }

    location /cgi-bin {
        methods GET POST;
        root /var/www/alpha/cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

# ================= SERVER 2 =================
server {
    listen 192.168.1.5:8081;
    listen 0.0.0.0:8000;
    server_name beta_server;
    client_max_bady_size 4096;

    error_page 403 /errors/403.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;

    # --- Locations ---
    location / {
        methods GET POST DELETE;
        root /srv/beta/www;
        autoindex off;
        index home.html;
    }

    location /api {
        methods GET POST DELETE;
        root /srv/beta/api;
        autoindex off;
    }

    location /php-bin {
        methods GET POST;
        root /srv/beta/php-bin;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
    }

    location /maintenance {
        methods GET;
        root /srv/beta/www;
        return 302 http://beta.maintenance.com/;
    }
}

# ================= SERVER 3 =================
server {
    listen 10.0.0.2:9090;
    listen 10.0.0.2:9091;
    server_name gamma_server;
    client_max_bady_size 8192;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET;
        root /data/gamma/html;
        autoindex on;
        index index.html;
    }

    location /ruby {
        methods GET POST;
        root /data/gamma/ruby;
        cgi_extension .rb;
        cgi_path /usr/bin/ruby;
    }

    location /backup {
        methods POST;
        root /data/gamma/backup;
        upload_enable on;
        upload_store /data/gamma/backup/tmp;
    }

    location /media {
        methods GET POST DELETE;
        root /data/gamma/media;
        index media_index.html;
        upload_enable off;
        autoindex off;
    }
}
