server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 5000000;

    location / {
		methods GET POST;
        root /home/maciej/ws/www;
        index index.html;
        autoindex off;
    }

    location /cgi-bin/ {
        root /home/maciej/ws/www;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
		upload_enable on;
    }

    location /uploads/ {
        root /home/maciej/ws/www;
        autoindex on;
		upload_enable on;
		upload_store /home/maciej/ws/www/uploads;
    }
}
