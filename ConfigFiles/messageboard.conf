server {
    listen 127.0.0.1:8081;
    server_name localhost;
    client_max_body_size 5000000;

    location / {
		methods GET POST;
        root ./www;
        root ./www;
        index index.html;
        autoindex off;
    }

    location /cgi-bin/ {
        root ./www;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
		upload_enable on;
    }

    location /uploads/ {
        root ./www;
		upload_enable on;
		upload_store ./www/uploads;
    }
}
