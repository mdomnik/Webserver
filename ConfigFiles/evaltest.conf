# ================================================================
# 🧩 Webserv Evaluation Test Config
# Root: ./www/evaltest
# ================================================================

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 2000000;

    # --- Error pages ---
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 500 /errors/500.html;

    # --- Root route ---
    location / {
        root ./www/evaltest;
        index index.html;
        autoindex on;
        methods GET;
    }

    # --- Upload route ---
    location /uploads/ {
        root ./www/evaltest;
        upload_enable on;
        upload_store ./www/evaltest/uploads;
        autoindex on;
        methods GET POST DELETE;
    }

    # --- CGI route ---
    location /cgi-bin/ {
        root ./www/evaltest;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        methods GET POST;
    }

    # --- Images route ---
    location /images/ {
        root ./www/evaltest;
        autoindex on;
        methods GET;
    }

    # --- Error directory (no autoindexx`) ---
    location /errors/ {
        root ./www/evaltest;
        autoindex off;
        methods GET;
    }
}
