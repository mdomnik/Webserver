server {
    listen 8080;
    server_name localhost;
    client_max_body_size 1000000;

	error_page 500 www/errors/500.html;
	error_page 404 www/errors/404.html;

    location / {
        root ./www;
        index index.html;
        autoindex on;
    }

    location /cgi-bin {
		methods GET POST;
        root ./www/cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}