server {
    listen 127.0.0.1:8080;
    server_name fashion_blog;
    client_max_body_size 10000000; # allow image uploads up to ~10MB

    # Custom error pages
    error_page 404 blog/errors/404.html;
    error_page 405 blog/errors/405.html;
    error_page 500 blog/errors/500.html;

    # Main site - fashion blog front
    location / {
        methods GET POST;
        root ./blog;
        index index.html;
        autoindex off;
    }

    # CGI handlers for uploads, comments, etc.
    location /cgi-bin/ {
        root ./blog;
        methods GET POST;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
        upload_enable on;
        upload_store ./blog/uploads;
    }

    # User uploads (images, posts)
    location /uploads/ {
        root ./blog;
        methods GET POST DELETE;
        upload_enable on;
        upload_store ./blog/uploads;
        autoindex on;  # optional, helps debug uploads
    }

    # Static assets
    location /images/ {
        root ./blog;
        methods GET;
        autoindex off;
    }

    location /posts/ {
        root ./blog;
        methods GET;
        autoindex on;  # optional if you want to browse post files
    }
}

# Secondary test server (e.g., for staging)
server {
    listen 127.0.0.1:8079;
    server_name fashion_blog_dev;
    client_max_body_size 10000000;

    error_page 404 blog/errors/404.html;
    error_page 500 blog/errors/500.html;

    location / {
        methods GET POST;
        root ./blog;
        index index.html;
        autoindex on; # enable browsing for testing
    }

    location /cgi-bin/ {
        root ./blog;
        methods GET POST;
        autoindex on;
        alias /cgi-bin;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
        upload_enable on;
        upload_store ./blog/uploads;
    }

    location /uploads/ {
        root ./blog;
        alias /uploads;
        methods GET POST DELETE;
        autoindex on;
        upload_enable on;
        upload_store ./blog/uploads;
    }
}
